name: my_salah_app
description: My Salah - Islamic Prayer Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Cloud Database + Auth
  supabase_flutter: ^2.5.0

  # Internet Connectivity Detection
  connectivity_plus: ^6.0.3

  # OTP Input UI
  pin_code_fields: ^8.0.1

  # Networking
  http: ^1.2.1

  # Location
  geolocator: ^13.0.1

  # Local Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Maps - OpenStreetMap (100% FREE, no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Timezone (for scheduling notifications at correct local times)
  timezone: ^0.9.0

  # Charts
  fl_chart: ^0.69.0

  # Calendar
  table_calendar: ^3.1.2

  # Date/Time
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#2B2B2B"
  adaptive_icon_foreground: "assets/images/app_logo.png"
